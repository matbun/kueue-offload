---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: identitymaps.interlink.eu
spec:
  group: interlink.eu
  names:
    kind: IdentityMap
    listKind: IdentityMapList
    plural: identitymaps
    singular: identitymap
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          IdentityMap maps Kubernetes users to HPC users. The membership controller
          reads it and never infers a mapping from names.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              IdentityMapSpec lists identity mappings. Entries of every IdentityMap are
              merged.
            properties:
              entries:
                items:
                  description: IdentityEntry maps one Kubernetes user to their HPC
                    user on one site.
                  properties:
                    hpcUser:
                      description: |-
                        hpcUser is the user name on the site, as in the user column of the
                        Slurm associations.
                      minLength: 1
                      type: string
                    kubernetesUser:
                      description: kubernetesUser is the Kubernetes identity, such
                        as an OIDC subject.
                      minLength: 1
                      type: string
                    namespace:
                      description: namespace is the user's namespace. Unset means
                        kubernetesUser.
                      type: string
                    site:
                      minLength: 1
                      type: string
                  required:
                  - hpcUser
                  - kubernetesUser
                  - site
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
