---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: offloadconfigs.interlink.eu
spec:
  group: interlink.eu
  names:
    kind: OffloadConfig
    listKind: OffloadConfigList
    plural: offloadconfigs
    singular: offloadconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workers
      name: Workers
      type: string
    - jsonPath: .spec.pollInterval
      name: Poll
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OffloadConfig holds the parameters of an offload AdmissionCheck and, for the
          membership controller of its site, the membership settings.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              OffloadConfigSpec holds the parameters of the AdmissionChecks with
              controllerName interlink.eu/offload that name it. One offload controller
              serves every such check and reads each check's OffloadConfig separately.
            properties:
              executorLostTimeout:
                default: 10m
                description: |-
                  executorLostTimeout is how long an OffloadRequest may go without an
                  executor heartbeat before the check is set to Retry, as MultiKueue's
                  workerLostTimeout.
                type: string
              executorPort:
                default: 8000
                description: executorPort is the port of the executor Service.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              executorService:
                default: kueue-offload-executor
                description: |-
                  executorService is the name of the executor Service in every tenant
                  namespace, which the shadows read job logs from. The membership controller
                  passes it to the executor template.
                type: string
              flavors:
                additionalProperties:
                  description: FlavorTarget is the batch queue a ResourceFlavor stands
                    for.
                  properties:
                    annotations:
                      additionalProperties:
                        type: string
                      description: |-
                        annotations are added to every member pod of a PodSet admitted on this
                        flavor. Each value is a Go text/template executed with .Account (the
                        ClusterQueue's account label), .MaxExecSeconds (the Workload's
                        maximumExecutionTimeSeconds, 0 when unset) and .MaxExecMinutes (the same in
                        minutes, rounded up). The executor appends each value to the template's own
                        value for that key, after a space, and never parses it, for example
                        slurm-job.vk.io/flags: "--account={{.Account}} --qos=prod{{with .MaxExecMinutes}} --time={{.}}{{end}}".
                      type: object
                  type: object
                description: |-
                  flavors maps a ResourceFlavor name to the batch queue its quota stands for,
                  as annotations the backend's plugin reads (for Slurm, the sbatch flags in
                  slurm-job.vk.io/flags). A project with several queues on one machine (say a
                  debug, a production and an interactive QOS) is one ClusterQueue with one
                  flavor each, and the flavor Kueue assigns decides where the job is submitted.
                  A PodSet none of whose admitted flavors is listed is rejected: its job would
                  carry no account.
                type: object
              maxQueueTime:
                description: |-
                  maxQueueTime is how long a submitted job may wait in the site's queue
                  before the check is set to Retry, which cancels it and lets Kueue requeue
                  the Workload, possibly on another flavor. Kueue puts no timeout on a
                  Pending check. Unset: no limit.
                type: string
              membership:
                description: membership configures the membership sync controller
                  for this site.
                properties:
                  admissionCheck:
                    description: |-
                      admissionCheck is the AdmissionCheck every ClusterQueue of the site
                      carries. Unset means the site name.
                    type: string
                  associations:
                    description: |-
                      associations holds the output of
                      sacctmgr --parsable2 --noheader show assoc format=cluster,account,user.
                      Rows with an empty user are account rows and are skipped.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  cohort:
                    description: |-
                      cohort is the Kueue Cohort of the site's ClusterQueues. Unset means the
                      site name.
                    type: string
                  defaultProjectQuota:
                    description: defaultProjectQuota is the quota of a project that
                      has no ProjectQuota.
                    items:
                      properties:
                        coveredResources:
                          description: |-
                            coveredResources is the list of resources covered by the flavors in this
                            group.
                            Examples: cpu, memory, vendor.com/gpu.
                            The list cannot be empty and it can contain up to 64 resources. With a total
                            of up to 256 covered resources across all resource groups in the ClusterQueue.
                          items:
                            description: ResourceName is the name identifying various
                              resources in a ResourceList.
                            type: string
                          maxItems: 64
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: atomic
                        flavors:
                          description: |-
                            flavors is the list of flavors that provide the resources of this group.
                            Typically, different flavors represent different hardware models
                            (e.g., gpu models, cpu architectures) or pricing models (on-demand vs spot
                            cpus).
                            Each flavor MUST list all the resources listed for this group in the same
                            order as the .resources field.
                            The list cannot be empty and it can contain up to 64 flavors, with a max of
                            256 total flavors across all resource groups in the ClusterQueue.
                          items:
                            properties:
                              name:
                                description: |-
                                  name of this flavor. The name should match the .metadata.name of a
                                  ResourceFlavor. If a matching ResourceFlavor does not exist, the
                                  ClusterQueue will have an Active condition set to False.
                                maxLength: 253
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                type: string
                              resources:
                                description: |-
                                  resources is the list of quotas for this flavor per resource.
                                  There could be up to 64 resources.
                                items:
                                  properties:
                                    borrowingLimit:
                                      anyOf:
                                      - type: integer
                                      - type: string
                                      description: |-
                                        borrowingLimit is the maximum amount of quota for the [flavor, resource]
                                        combination that this ClusterQueue is allowed to borrow from the unused
                                        quota of other ClusterQueues in the same cohort.
                                        In total, at a given time, Workloads in a ClusterQueue can consume a
                                        quantity of quota equal to nominalQuota+borrowingLimit, assuming the other
                                        ClusterQueues in the cohort have enough unused quota.
                                        If null, it means that there is no borrowing limit.
                                        If not null, it must be non-negative.
                                        borrowingLimit must be null if spec.cohortName is empty.
                                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                      x-kubernetes-int-or-string: true
                                    lendingLimit:
                                      anyOf:
                                      - type: integer
                                      - type: string
                                      description: |-
                                        lendingLimit is the maximum amount of unused quota for the [flavor, resource]
                                        combination that this ClusterQueue can lend to other ClusterQueues in the same cohort.
                                        In total, at a given time, ClusterQueue reserves for its exclusive use
                                        a quantity of quota equals to nominalQuota - lendingLimit.
                                        If null, it means that there is no lending limit, meaning that
                                        all the nominalQuota can be borrowed by other clusterQueues in the cohort.
                                        If not null, it must be non-negative.
                                        lendingLimit must be null if spec.cohortName is empty.
                                        This field is in beta stage and is enabled by default.
                                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                      x-kubernetes-int-or-string: true
                                    name:
                                      description: name of this resource.
                                      type: string
                                    nominalQuota:
                                      anyOf:
                                      - type: integer
                                      - type: string
                                      description: |-
                                        nominalQuota is the quantity of this resource that is available for
                                        Workloads admitted by this ClusterQueue at a point in time.
                                        The nominalQuota must be non-negative.
                                        nominalQuota should represent the resources in the cluster available for
                                        running jobs (after discounting resources consumed by system components
                                        and pods not managed by kueue). In an autoscaled cluster, nominalQuota
                                        should account for resources that can be provided by a component such as
                                        Kubernetes cluster-autoscaler.

                                        If the ClusterQueue belongs to a cohort, the sum of the quotas for each
                                        (flavor, resource) combination defines the maximum quantity that can be
                                        allocated by a ClusterQueue in the cohort.
                                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                      x-kubernetes-int-or-string: true
                                  required:
                                  - name
                                  - nominalQuota
                                  type: object
                                maxItems: 64
                                minItems: 1
                                type: array
                                x-kubernetes-list-map-keys:
                                - name
                                x-kubernetes-list-type: map
                            required:
                            - name
                            - resources
                            type: object
                          maxItems: 64
                          minItems: 1
                          type: array
                          x-kubernetes-list-map-keys:
                          - name
                          x-kubernetes-list-type: map
                      required:
                      - coveredResources
                      - flavors
                      type: object
                      x-kubernetes-validations:
                      - message: flavors must have the same number of resources as
                          the coveredResources
                        rule: self.flavors.all(x, size(x.resources) == size(self.coveredResources))
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  executorImage:
                    description: executorImage is passed to the executor template
                      as .Image.
                    type: string
                  executorTemplate:
                    description: |-
                      executorTemplate holds a Go text/template that renders the executor objects
                      of one tenant namespace as multi-document YAML. It may produce only
                      namespaced objects. Unset means no executor objects are rendered.
                    properties:
                      key:
                        minLength: 1
                        type: string
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    - namespace
                    type: object
                  slurmCluster:
                    description: |-
                      slurmCluster is the value of the cluster column of the associations that
                      belong to this site. Rows of other clusters are ignored.
                    minLength: 1
                    type: string
                  syncInterval:
                    default: 15m
                    description: |-
                      syncInterval is how often the memberships are synchronised when
                      nothing changed.
                    type: string
                required:
                - associations
                - slurmCluster
                type: object
              pollInterval:
                default: 15s
                description: |-
                  pollInterval is how often each executor is expected to report on its
                  OffloadRequests (their lastSyncTime heartbeat), and how often the offload
                  controller looks at a Workload whose request did not change. A request
                  with no heartbeat for twice this long shows "no executor answering" in the
                  check message.
                type: string
              retryStrategy:
                default:
                  backoffBaseSeconds: 60
                  backoffLimitCount: 3
                  backoffMaxSeconds: 1800
                description: |-
                  retryStrategy bounds the new attempts after a job is lost: cancelled on
                  the site, behind an executor without a heartbeat for executorLostTimeout,
                  or queued for longer than maxQueueTime. Each loss sets the check to Retry
                  with requeueAfterSeconds from Kueue's backoff, backoffBaseSeconds doubled
                  per retry up to backoffMaxSeconds, and Kueue requeues the Workload after
                  that delay. The retries are counted by the OffloadRequest's attempt; once
                  backoffLimitCount retries were spent the check is Rejected, and 0 rejects
                  at the first loss. A job that ran and failed is not retried, and a submit
                  the executor refuses for now (a submit limit, an unreachable site) keeps
                  the check Pending with the quota. The type and its defaults are
                  ProvisioningRequestConfig's.
                properties:
                  backoffBaseSeconds:
                    default: 60
                    description: |-
                      backoffBaseSeconds defines the base for the exponential backoff for
                      re-queuing an evicted workload.

                      Defaults to 60.
                    format: int32
                    type: integer
                  backoffLimitCount:
                    default: 3
                    description: |-
                      backoffLimitCount defines the maximum number of re-queuing retries.
                      Once the number is reached, the workload is deactivated (`.spec.activate`=`false`).

                      Every backoff duration is about "b*2^(n-1)+Rand" where:
                      - "b" represents the base set by "BackoffBaseSeconds" parameter,
                      - "n" represents the "workloadStatus.requeueState.count",
                      - "Rand" represents the random jitter.
                      During this time, the workload is taken as an inadmissible and
                      other workloads will have a chance to be admitted.
                      By default, the consecutive requeue delays are around: (60s, 120s, 240s, ...).

                      Defaults to 3.
                    format: int32
                    type: integer
                  backoffMaxSeconds:
                    default: 1800
                    description: |-
                      backoffMaxSeconds defines the maximum backoff time to re-queue an evicted workload.

                      Defaults to 1800.
                    format: int32
                    type: integer
                type: object
              workers:
                description: |-
                  workers names the OffloadWorkers the check may submit to. The check is
                  Active while one of them is. A check submits to one site until a
                  dispatcher chooses among several, so the list holds one name.
                items:
                  type: string
                maxItems: 1
                minItems: 1
                type: array
                x-kubernetes-list-type: set
            required:
            - workers
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
