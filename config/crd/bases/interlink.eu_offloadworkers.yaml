metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: offloadworkers.interlink.eu
spec:
  group: interlink.eu
  names:
    kind: OffloadWorker
    listKind: OffloadWorkerList
    plural: offloadworkers
    singular: offloadworker
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.loginEndpoint
      name: Endpoint
      type: string
    - jsonPath: .status.conditions[?(@.type=="Active")].status
      name: Active
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          OffloadWorker is one HPC site, named after it. It has MultiKueueCluster's
          role for a site with no Kubernetes API: OffloadConfigs name the workers their
          checks submit to, and a check is Active while one of them is.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: OffloadWorkerSpec describes one site.
            properties:
              loginEndpoint:
                description: |-
                  loginEndpoint is the host:port of the site's login service, which every
                  executor of the site reaches. The worker is Active while the offload
                  controller can open a TCP connection to it.
                minLength: 1
                type: string
            required:
            - loginEndpoint
            type: object
          status:
            description: |-
              OffloadWorkerStatus holds the worker's Active condition. It comes from
              site-level facts only, never from one tenant's executor, since an inactive
              check makes every ClusterQueue that uses it inactive.
            properties:
              conditions:
