---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: submitrecords.interlink.eu
spec:
  group: interlink.eu
  names:
    kind: SubmitRecord
    listKind: SubmitRecordList
    plural: submitrecords
    singular: submitrecord
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workload.name
      name: Workload
      type: string
    - jsonPath: .spec.workload.namespace
      name: Namespace
      type: string
    - jsonPath: .status.jobID
      name: Job
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SubmitRecord is the dispatcher's durable record of a submission. Its name is
          the Workload UID, so a restarted dispatcher does not submit twice.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SubmitRecordSpec is fixed when the record is created, before the first
              submission.
            properties:
              account:
                type: string
              agentEndpoint:
                description: agentEndpoint is the base URL of the agent the job was
                  submitted to.
                type: string
              site:
                type: string
              workload:
                description: WorkloadReference names the Kueue Workload a SubmitRecord
                  belongs to.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
            required:
            - agentEndpoint
            - site
            - workload
            type: object
          status:
            description: SubmitRecordStatus is the dispatcher's view of the job.
            properties:
              firstUnreachable:
                description: |-
                  firstUnreachable is when the agent stopped answering. Unset while it
                  answers.
                format: date-time
                type: string
              jobID:
                description: jobID is the Slurm job ID. Empty when no job is held
                  for the Workload.
                type: string
              lastPoll:
                format: date-time
                type: string
              message:
                type: string
              nodeName:
                type: string
              retries:
                description: |-
                  retries counts resubmissions after the job was cancelled on the site or
                  the agent was lost.
                format: int32
                type: integer
              state:
                description: |-
                  state is the last state the agent reported, or the dispatcher's own
                  outcome (submitted, rejected, lost).
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
