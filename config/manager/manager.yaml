apiVersion: apps/v1
kind: Deployment
metadata:
  name: kueue-offload-hpc-a
  namespace: kueue-offload
  labels:
    app: kueue-offload
    interlink.eu/site: hpc-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kueue-offload
      interlink.eu/site: hpc-a
  template:
    metadata:
      labels:
        app: kueue-offload
        interlink.eu/site: hpc-a
    spec:
      serviceAccountName: kueue-offload
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: offload-controller
        image: kueue-offload:latest
        command: [/offload-controller]
        args:
        - --site=hpc-a
        - --namespace=kueue-offload
        - --token-file=/var/run/secrets/interlink/token
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --leader-elect
        ports:
        - {name: metrics, containerPort: 8080}
        - {name: probes, containerPort: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: probes}
        readinessProbe:
          httpGet: {path: /readyz, port: probes}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: interlink-token
          mountPath: /var/run/secrets/interlink
          readOnly: true
      volumes:
      - name: interlink-token
        projected:
          sources:
          - serviceAccountToken:
              audience: kueue-offload-executor
              expirationSeconds: 3600
              path: token
