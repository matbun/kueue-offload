# The executor objects of one tenant namespace. The membership controller executes
# this Go text/template once per namespace with .Namespace, .Site, .HPCUser,
# .Accounts (sorted), .Image, .ExecutorService and .ExecutorPort, and applies every
# document in that namespace. Functions: join, quote, toJson.
#
# The Secrets <site>-submit-key and <site>-tunnel-key and the ConfigMap
# <site>-known-hosts are created by the user or the site, never by the
# controller.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpc-a-executor-template
  namespace: kueue-offload-membership
data:
  template.yaml: |
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: {{ .ExecutorService }}
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ .ExecutorService }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kueue-offload-executor
    subjects:
    - kind: ServiceAccount
      name: {{ .ExecutorService }}
      namespace: {{ .Namespace }}
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ .ExecutorService }}
    data:
      SlurmConfig.yaml: |
        SidecarPort: "{{ .ExecutorPort }}"
        DataRootFolder: /scratch/{{ .HPCUser }}/.interlink/
        SocketDirRoot: /scratch/{{ .HPCUser }}/.interlink/sockets
        SbatchPath: /usr/local/bin/ssh-shim sbatch
        SqueuePath: /usr/local/bin/ssh-shim squeue
        ScancelPath: /usr/local/bin/ssh-shim scancel
        ContainerRuntime: singularity
        Executor:
          Enabled: true
          Auth:
            Mode: tokenreview
            Audience: kueue-offload-executor
            AllowedServiceAccounts: ["system:serviceaccount:kueue-offload:kueue-offload"]
        Sites:
          {{ .Site }}:
            LoginHost: login.hpc-a.example.org
            User: {{ .HPCUser }}
            Port: 22
            KeyFile: /etc/interlink/keys/{{ .Site }}/ssh-privatekey
            AllowedAccounts: {{ toJson .Accounts }}
        Shadow:
          Enabled: true
          AlwaysShadow: true
          Image: ghcr.io/interlink-hq/interlink/ssh-tunnel:0.6.3-pre2
          ExecutorURL: http://{{ .ExecutorService }}:{{ .ExecutorPort }}
          KeySecret: {{ .Site }}-tunnel-key
          KeySecretKey: ssh-privatekey
          KnownHostsConfigMap: {{ .Site }}-known-hosts
          NodeHostKeys: verify
          ForwardTarget: node
          ForwardMode: portforward
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .ExecutorService }}
    spec:
      replicas: 1
      selector:
        matchLabels: {app: {{ .ExecutorService }}}
      template:
        metadata:
          labels: {app: {{ .ExecutorService }}}
          annotations:
            # A changed membership rolls the executor, which reads its config once.
            hpc.interlink.eu/accounts: {{ join "," .Accounts | quote }}
        spec:
          serviceAccountName: {{ .ExecutorService }}
          containers:
          - name: executor
            image: {{ .Image }}
            env:
            - {name: SLURMCONFIGPATH, value: /etc/interlink/SlurmConfig.yaml}
            - {name: EXECUTOR_IMAGE, value: {{ quote .Image }}}
            ports:
            - {containerPort: {{ .ExecutorPort }}}
            readinessProbe:
              httpGet: {path: /healthz, port: {{ .ExecutorPort }}}
            volumeMounts:
            - {name: config, mountPath: /etc/interlink}
            - {name: submit-key, mountPath: /etc/interlink/keys/{{ .Site }}, readOnly: true}
          volumes:
          - name: config
            configMap: {name: {{ .ExecutorService }}}
          - name: submit-key
            secret: {secretName: {{ .Site }}-submit-key, defaultMode: 0400}
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .ExecutorService }}
    spec:
      selector: {app: {{ .ExecutorService }}}
      ports:
      - {port: {{ .ExecutorPort }}, targetPort: {{ .ExecutorPort }}}
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: {{ .ExecutorService }}
    spec:
      podSelector: {matchLabels: {app: {{ .ExecutorService }}}}
      policyTypes: [Ingress]
      ingress:
      - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kueue-offload}}
          podSelector: {matchLabels: {app: kueue-offload}}
        ports: [{port: {{ .ExecutorPort }}}]
      - from:
        - podSelector: {matchLabels: {interlink.eu/shadow: "true"}}
        ports: [{port: {{ .ExecutorPort }}}]
