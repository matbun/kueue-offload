# The executor objects of one tenant namespace. The membership controller executes
# this Go text/template once per namespace with .Namespace, .Site, .HPCUser,
# .Accounts (sorted), .Image, .ExecutorService and .ExecutorPort, and applies every
# document in that namespace. Functions: join, quote, toJson.
#
# The tenant pod runs three containers, as interLink's own in-cluster deployment
# does: the executor (.Image, the kueue-offload image), a stock interLink API
# server, and the interLink Slurm plugin, which reaches the site through its ssh
# shims. The API server must carry PodStatus.SocketDir for the reverse tunnel.
#
# The Secrets <site>-submit-key and <site>-tunnel-key, the ConfigMap
# <site>-known-hosts and the PersistentVolumeClaim <site>-jobs (the site's
# filesystem at the same path, such as a csi-rclone volume) are created by the
# user or the site, never by the controller.
#
# The ServiceAccount is named after .ExecutorService. The admission policy of
# config/admission lets only kueue-offload-executor, the default, write the status
# of the namespace's OffloadRequests: a site that sets another executorService
# edits the policy's executor variable too.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpc-a-executor-template
  namespace: kueue-offload-membership
data:
  template.yaml: |
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: {{ .ExecutorService }}
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ .ExecutorService }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kueue-offload-executor
    subjects:
    - kind: ServiceAccount
      name: {{ .ExecutorService }}
      namespace: {{ .Namespace }}
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: {{ .ExecutorService }}
    data:
      executor.yaml: |
        Listen: ":{{ .ExecutorPort }}"
        InterLink:
          URL: http://127.0.0.1:3000
        Executor:
          PollInterval: 15s
        Sites:
          {{ .Site }}:
            AllowedAccounts: {{ toJson .Accounts }}
        Shadow:
          Enabled: true
          AlwaysShadow: true
          Image: ghcr.io/interlink-hq/interlink/ssh-tunnel:0.6.3-pre2
          ExecutorURL: http://{{ .ExecutorService }}:{{ .ExecutorPort }}
          LoginHost: login.hpc-a.example.org
          User: {{ .HPCUser }}
          Port: 22
          KeySecret: {{ .Site }}-tunnel-key
          KeySecretKey: ssh-privatekey
          KnownHostsConfigMap: {{ .Site }}-known-hosts
          NodeHostKeys: verify
          ForwardTarget: node
          ForwardMode: portforward
      InterLinkConfig.yaml: |
        InterlinkAddress: http://127.0.0.1
        InterlinkPort: "3000"
        SidecarURL: http://127.0.0.1
        SidecarPort: "4000"
      SlurmConfig.yaml: |
        SidecarPort: "4000"
        DataRootFolder: /scratch/{{ .HPCUser }}/interlink/
        SocketDirRoot: /scratch/{{ .HPCUser }}/interlink/sockets
        SbatchPath: /usr/local/bin/ssh-shim sbatch
        SqueuePath: /usr/local/bin/ssh-shim squeue
        ScancelPath: /usr/local/bin/ssh-shim scancel
        ContainerRuntime: singularity
        GangSchedulingEnabled: true
        GangTimeout: 10m
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: {{ .ExecutorService }}
    spec:
      replicas: 1
      selector:
        matchLabels: {app: {{ .ExecutorService }}}
      template:
        metadata:
          labels: {app: {{ .ExecutorService }}}
          annotations:
            # A changed membership rolls the executor, which reads its config once.
            hpc.interlink.eu/accounts: {{ join "," .Accounts | quote }}
        spec:
          serviceAccountName: {{ .ExecutorService }}
          containers:
          - name: executor
            image: {{ .Image }}
            command: [/executor, --config, /etc/kueue-offload/executor.yaml]
            env:
            - {name: EXECUTOR_IMAGE, value: {{ quote .Image }}}
            ports:
            - {containerPort: {{ .ExecutorPort }}}
            readinessProbe:
              httpGet: {path: /healthz, port: {{ .ExecutorPort }}}
            volumeMounts:
            - {name: config, mountPath: /etc/kueue-offload/executor.yaml, subPath: executor.yaml, readOnly: true}
          - name: interlink
            image: ghcr.io/interlink-hq/interlink/interlink:0.6.3-pre2
            env:
            - {name: INTERLINKCONFIGPATH, value: /etc/interlink/InterLinkConfig.yaml}
            volumeMounts:
            - {name: config, mountPath: /etc/interlink/InterLinkConfig.yaml, subPath: InterLinkConfig.yaml, readOnly: true}
          - name: plugin
            image: ghcr.io/interlink-hq/interlink-slurm-plugin:0.6.3-pre2
            env:
            - {name: SLURMCONFIGPATH, value: /etc/interlink/SlurmConfig.yaml}
            # The ssh shims read the site from the environment.
            - {name: REMOTE_USER, value: {{ quote .HPCUser }}}
            - {name: REMOTE_LOGIN, value: login.hpc-a.example.org}
            - {name: REMOTE_PORT, value: "22"}
            - {name: SSH_KEY, value: /etc/interlink/keys/{{ .Site }}/ssh-privatekey}
            volumeMounts:
            - {name: config, mountPath: /etc/interlink/SlurmConfig.yaml, subPath: SlurmConfig.yaml, readOnly: true}
            - {name: submit-key, mountPath: /etc/interlink/keys/{{ .Site }}, readOnly: true}
            - {name: jobs, mountPath: /scratch/{{ .HPCUser }}/interlink}
          volumes:
          - name: config
            configMap: {name: {{ .ExecutorService }}}
          - name: submit-key
            secret: {secretName: {{ .Site }}-submit-key, defaultMode: 0400}
          - name: jobs
            persistentVolumeClaim: {claimName: {{ .Site }}-jobs}
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .ExecutorService }}
    spec:
      selector: {app: {{ .ExecutorService }}}
      ports:
      - {port: {{ .ExecutorPort }}, targetPort: {{ .ExecutorPort }}}
    ---
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: {{ .ExecutorService }}
    spec:
      podSelector: {matchLabels: {app: {{ .ExecutorService }}}}
      policyTypes: [Ingress]
      # Only the shadows call the executor, for the job's logs.
      ingress:
      - from:
        - podSelector: {matchLabels: {interlink.eu/shadow: "true"}}
        ports: [{port: {{ .ExecutorPort }}}]
