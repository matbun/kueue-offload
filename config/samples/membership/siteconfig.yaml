apiVersion: interlink.eu/v1alpha1
kind: SiteConfig
metadata:
  name: hpc-a
spec:
  agentService: interlink-agent
  agentPort: 8000
  pollInterval: 15s
  agentLostTimeout: 10m
  maxRetries: 3
  flavorPartitions: {hpc-a-gpu: gpu, hpc-a-cpu: cpu}
  membership:
    slurmCluster: hpc-a
    associations: {namespace: interlink-membership, name: hpc-a-associations, key: associations}
    agentTemplate: {namespace: interlink-membership, name: hpc-a-agent-template, key: template.yaml}
    agentImage: ghcr.io/interlink-hq/interlink-slurm-plugin:0.6.3-pre2
    agentTokenReview: true
    syncInterval: 15m
    defaultProjectQuota:
    - coveredResources: [cpu, memory, nvidia.com/gpu]
      flavors:
      - name: hpc-a-gpu
        resources:
        - {name: cpu, nominalQuota: 64}
        - {name: memory, nominalQuota: 512Gi}
        - {name: nvidia.com/gpu, nominalQuota: 8}
